# Liara Reverse Proxy Configuration
# Place this file in: /etc/nginx/sites-available/liara
# Enable with: sudo ln -s /etc/nginx/sites-available/liara /etc/nginx/sites-enabled/

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name liara 192.168.178.50;
    
    return 301 https://$server_name$request_uri;
}

# Main HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name liara 192.168.178.50;

    # SSL Certificate (selbstsigniert oder Let's Encrypt)
    ssl_certificate /etc/ssl/certs/liara.crt;
    ssl_certificate_key /etc/ssl/private/liara.key;
    
    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    # Root für Frontend (production build)
    root /opt/liara/frontend/dist;
    index index.html;

    # Frontend - Static Files
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # Backend API - Proxy to FastAPI
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://127.0.0.1:8100/;
        proxy_http_version 1.1;
        
        # Preserve Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Basic Auth wird vom Backend (FastAPI) gehandhabt
        # Alternativ kannst du hier nginx Basic Auth nutzen:
        # auth_basic "Liara Access";
        # auth_basic_user_file /opt/liara/.htpasswd;
    }

    # WebSocket Support (falls später benötigt)
    location /ws {
        proxy_pass http://127.0.0.1:8100/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Logs
    access_log /var/log/nginx/liara-access.log;
    error_log /var/log/nginx/liara-error.log;
}
