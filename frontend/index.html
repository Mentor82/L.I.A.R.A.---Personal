<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Cache Control - Force Reload -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <meta name="description" content="Liara - Deine persönliche Digitalbegleiterin" />
    <title>Liara - Digitalbegleiterin</title>

    <!--
      Applies the stored theme before first paint, eliminating the
      flash-of-wrong-theme (e.g. a stored "light" preference briefly
      rendering dark, since theme.css's bare :root is the dark palette).
      Plain JS, duplicated from utils/theme.js's resolveEffectiveTheme()
      deliberately - this must run before any module/bundle exists yet.
      Keep the storage key in sync with THEME_STORAGE_KEY in
      frontend/src/utils/theme.js if it's ever renamed.
    -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('liara_theme') || 'system';
          var effective = pref === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : pref;
          document.documentElement.setAttribute('data-theme', effective);
        } catch (e) {
          // localStorage unavailable (private mode, etc.) - fall through
          // to theme.css's default (dark) rather than block rendering.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
