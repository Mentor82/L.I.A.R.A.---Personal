# Liara Reverse Proxy Configuration with Unix Domain Socket Upstream

# Upstream Definitions
upstream liara_backend {
    server unix:/run/liara/liara-backend.sock fail_timeout=0;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    if ($host = liara.mw-dresden.de) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name liara.mw-dresden.de 192.168.178.50;
    
    return 301 https://$server_name$request_uri;
}

# Main HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name liara.mw-dresden.de 192.168.178.50;
    client_max_body_size 15M;

    # SSL Certificate
    ssl_certificate /etc/ssl/certs/cloudflare-origin.crt;
    ssl_certificate_key /etc/ssl/private/cloudflare-origin.key;
    
    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Root für Frontend (production build)
    root /opt/liara/frontend/dist;
    index index.html;

    # Frontend HTML - No Cache (force reload on updates)
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Frontend Assets - Cache with validation (JS/CSS can be cached but revalidate)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Frontend - All other routes (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Backend API - Proxy to FastAPI via Unix Domain Socket Upstream
    location ^~ /api/ {
        proxy_pass http://liara_backend/;
        proxy_http_version 1.1;
        
        # WebSocket Support (for terminal PTY)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Preserve Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # WebSocket Support via Unix Domain Socket Upstream
    location /ws {
        proxy_pass http://liara_backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Neo4j Browser - Admin only
    location /neo4j/ {
        proxy_pass http://127.0.0.1:7474/;
        proxy_http_version 1.1;
        
        # Preserve Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket Support for Neo4j Browser
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Logs
    access_log /var/log/nginx/liara-access.log;
    error_log /var/log/nginx/liara-error.log;

    # SSE Streaming - Direct to Uvicorn (No Buffering)
    location /api/chat/stream {
        proxy_pass http://127.0.0.1:8101/chat/stream;
        proxy_http_version 1.1;
        
        # SSE Headers
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Disable ALL buffering for real-time streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        
        # SSE Timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # SSE Headers
        add_header Cache-Control "no-cache" always;
        add_header X-Accel-Buffering "no" always;
    }
}
